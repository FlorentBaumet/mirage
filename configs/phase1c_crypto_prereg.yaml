  fige_le: "2026-10-01"
  phase_precedente: "configs/phase1_crypto_prereg.yaml (44 dates x 5 symboles, publié)"
  question: >
    L'ajout de l'OFI événementiel au vecteur d'état améliore-t-il la prévision du
    rendement, et cet apport suffit-il à changer le verdict économique ?

