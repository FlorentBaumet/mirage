# Pré-enregistrement - Phase 1c crypto : ENRICHISSEMENT DU WORLD MODEL (OFI)
#
# FIGÉ et COMMITÉ AVANT toute exécution de l'évaluation enrichie. Rien ici ne se
# modifie après avoir vu un résultat (invariant I3). Toute déviation doit apparaître
# dans le rapport COMME déviation, pas être absorbée.
#
# Motif : le rapport de la phase 1 ([reports/PHASE1_CRYPTO.md]) conclut à un signal
# réel mais non exploitable, et note explicitement que le R²_OOS y est un PLANCHER.
# La question de cette phase : apporter au modèle une information que les barres 1 s
# ne contiennent pas change-t-il le verdict économique ?

