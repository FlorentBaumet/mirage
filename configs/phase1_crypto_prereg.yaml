# Pré-enregistrement — Phase 1 crypto (carnet Bybit L2), jeu élargi
#
# FIGÉ le 2026-09-29 et COMMITÉ AVANT toute exécution de l'évaluation sur le jeu
# élargi. Rien ici ne se modifie après avoir vu un résultat (invariant I3). Toute
# déviation doit apparaître dans le rapport comme déviation, pas être absorbée.
#
# Motif : le résultat phare (R²_OOS(ret) ≈ +0.067, net négatif dès 2 bp) ne reposait
# que sur 6 jours × 3 symboles. La sonde HEAD du 2026-09-29 a montré que l'archive
# Bybit couvre en réalité 2023-01-18 → 2025-08-20 (947 jours, aucun trou interne),
# et non les ~3 mois documentés. On consolide sur le jeu élargi.

meta:
  nom: phase1_crypto_elargi
  fige_le: "2026-09-29"
  jeu_precedent: "6 dates x 3 symboles (mai→août 2025) — inclus strictement ci-dessous"

donnees:
  source: "Bybit L2, quote-saver.bycsi.com/orderbook/linear, dumps ob500 (500 niveaux)"
  symboles: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT]
  dates:
    - "2023-01-20"
    - "2023-02-11"
    - "2023-03-06"
    - "2023-03-28"
    - "2023-04-20"
    - "2023-05-12"
