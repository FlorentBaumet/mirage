[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "0.0.1"
description = "MIRAGE — world model de marche (LOB/prix) + evaluation honnete"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]       # uniquement pour le world model GRU (Phase 0 marche sans)
dev = ["pytest>=7.4", "wandb>=0.16", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
